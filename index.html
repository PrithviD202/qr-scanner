<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- QR Scanner Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 0;
    }

    h2 {
      margin-top: 15px;
    }

    select, button {
      padding: 12px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #007bff;
      color: white;
    }

    #scanner {
      width: 100%;
      margin-top: 10px;
    }

    .card {
      margin: 10px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
    }

    .approved {
      background: #0f9d58;
    }

    .denied {
      background: #d93025;
    }
  </style>
</head>

<body>

<h2>QR Entry Scanner</h2>

<select id="authority">
  <option value="">Select Security Authority</option>
  <option>Gate 1</option>
  <option>Gate 2</option>
  <option>Main Desk</option>
</select>

<br>

<button onclick="startScanner()">Start Scanner</button>

<div id="scanner"></div>
<div id="result"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzAXayC2ihWNVdLVJ0ET0rcnq9SupMWDDA5YX5oKwwGMApP7ncRthIXXVgGLR4ZZ0p2hg/exec";

let html5QrCode;
let lastScan = "";
let lastTime = 0;

// Start scanner
function startScanner() {
  const authority = document.getElementById("authority").value;

  if (!authority) {
    alert("Select Security Authority");
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(() => {
      html5QrCode = new Html5Qrcode("scanner");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => handleScan(decodedText, authority)
      );
    })
    .catch(() => alert("Camera permission denied"));
}

// Handle QR scan
function handleScan(id, authority) {
  const now = Date.now();

  if (id === lastScan && now - lastTime < 2000) return;

  lastScan = id;
  lastTime = now;

  const url = `${API_URL}?id=${encodeURIComponent(id.trim())}&authority=${encodeURIComponent(authority)}`;

  fetch(url)
    .then(res => res.json())
    .then(showResult)
    .catch(err => alert("Error: " + err));
}

// Show result
function showResult(res) {
  const box = document.getElementById("result");

  if (!res || res.error) {
    box.innerHTML = `
      <div class="card denied">
        <h2>ERROR</h2>
        <p>${res?.error || "Unknown error"}</p>
      </div>
    `;
    return;
  }

  const isApproved = res.status === "APPROVED";

  box.innerHTML = `
    <div class="card ${isApproved ? 'approved' : 'denied'}">
      <h2>${res.status}</h2>
      <p><b>Unique ID:</b> ${res.id}</p>
      <p><b>Name:</b> ${res.name}</p>
      <p><b>Gender:</b> ${res.gender}</p>
      <p><b>Age:</b> ${res.age}</p>
      <p><b>Facilitator:</b> ${res.facilitator}</p>
      <p><b>Passcode:</b> ${res.passcode}</p>
      <p><b>Time:</b> ${new Date(res.timestamp).toLocaleTimeString()}</p>
    </div>
  `;
}

</script>

</body>
</html>
