<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  margin:0;
}

select,input,button{
  padding:12px;
  margin:5px;
  font-size:16px;
  border-radius:8px;
  border:none;
}

button{
  background:#1976d2;
  color:white;
}

.card{
  margin:10px;
  padding:20px;
  border-radius:12px;
}

.approved{
  background:#0f9d58;
}

.denied{
  background:#d93025;
}

#scanner{
  width:100%;
  margin-top:10px;
}

</style>

</head>

<body>

<h2>QR Entry Scanner</h2>

<select id="authority">
  <option value="">Select Security Authority</option>
  <option value="Gate 1">Gate 1</option>
  <option value="Gate 2">Gate 2</option>
  <option value="Main Desk">Main Desk</option>
</select>

<br>

<input
type="password"
id="passcode"
placeholder="Authority Passcode">

<br>

<button onclick="loginAndStart()">
Start Scanner
</button>

<div id="scanner"></div>

<div id="result"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzv74q75qmuVk_UiNmEw-PM-8oWcjguyDBiS3ZPdppgY8nH0v7PkAY2vZYLCoHwdwPj0w/exec";

let html5QrCode;
let lastScan = "";
let lastTime = 0;
let isProcessing = false;

/*
|--------------------------------------------------------------------------
| LOGIN
|--------------------------------------------------------------------------
*/
function loginAndStart() {

  const authority =
    document.getElementById("authority").value;

  const passcode =
    document.getElementById("passcode").value;

  if (!authority) {
    alert("Select Security Authority");
    return;
  }

  if (!passcode) {
    alert("Enter Passcode");
    return;
  }

  fetch(
    `${API_URL}?action=login&authority=${encodeURIComponent(authority)}&passcode=${encodeURIComponent(passcode)}`
  )

  .then(r => r.json())

  .then(res => {

    if (res.status === "AUTHORIZED") {
      startScanner(authority);
    }
    else {
      alert("Invalid Passcode");
    }

  })

  .catch(err => alert(err));

}

/*
|--------------------------------------------------------------------------
| START CAMERA
|--------------------------------------------------------------------------
*/
function startScanner(authority) {

  navigator.mediaDevices.getUserMedia({
    video: true
  })

  .then(() => {

    html5QrCode =
      new Html5Qrcode("scanner");

    html5QrCode.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: 250
      },

      (decodedText) => {
        handleScan(decodedText, authority);
      }

    );

  })

  .catch(() => {
    alert("Camera Permission Denied");
  });

}

/*
|--------------------------------------------------------------------------
| SCAN
|--------------------------------------------------------------------------
*/
function handleScan(id, authority) {

  if (isProcessing) {
    return;
  }

  const now = Date.now();

  if (
    id === lastScan &&
    now - lastTime < 3000
  ) {
    return;
  }

  lastScan = id;
  lastTime = now;

  isProcessing = true;

  html5QrCode.pause();

  fetch(
    `${API_URL}?action=scan&id=${encodeURIComponent(id)}&authority=${encodeURIComponent(authority)}`
  )

  .then(r => r.json())

  .then(res => {

    showResult(res);

    setTimeout(() => {

      html5QrCode.resume();

      isProcessing = false;

    }, 1500);

  })

  .catch(err => {

    alert(err);

    html5QrCode.resume();

    isProcessing = false;

  });

}

/*
|--------------------------------------------------------------------------
| SHOW RESULT
|--------------------------------------------------------------------------
*/
function showResult(res) {

  const approved =
    res.status === "APPROVED";

  document.getElementById("result").innerHTML = `

    <div class="card ${approved ? "approved" : "denied"}">

      <h2>${res.status}</h2>

      <p><b>Unique ID:</b> ${res.id}</p>

      <p><b>Name:</b> ${res.name}</p>

      <p><b>Gender:</b> ${res.gender}</p>

      <p><b>Age:</b> ${res.age}</p>

      <p><b>Facilitator:</b> ${res.facilitator}</p>

      <p><b>Passcode:</b> ${res.passcode}</p>

      <p>
      <b>Time:</b>
      ${new Date(res.timestamp).toLocaleTimeString()}
      </p>

    </div>

  `;

}

</script>

</body>
</html>
