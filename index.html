<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
body { font-family: Arial; text-align: center; background: #111; color: white; }
select, input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 8px; }
.card { margin: 10px; padding: 20px; border-radius: 10px; }
.approved { background: green; }
.denied { background: red; }
</style>
</head>

<body>

<h2>QR Entry Scanner</h2>

<select id="authority">
  <option value="">Select Security Authority</option>
  <option>Gate 1</option>
  <option>Gate 2</option>
  <option>Main Desk</option>
</select>

<br>

<input type="password" id="passcode" placeholder="4-digit passcode" maxlength="4">

<br>

<button onclick="validateAndStart()">Start Scanner</button>

<div id="scanner"></div>
<div id="result"></div>

<audio id="successSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="failSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzAXayC2ihWNVdLVJ0ET0rcnq9SupMWDDA5YX5oKwwGMApP7ncRthIXXVgGLR4ZZ0p2hg/exec";

let html5QrCode;
let lastScan = "";
let lastTime = 0;

// 🔐 VALIDATE FIRST
function validateAndStart() {
  const authority = document.getElementById("authority").value;
  const passcode = document.getElementById("passcode").value;

  if (!authority) return alert("Select Security Authority");
  if (passcode.length !== 4) return alert("Enter 4-digit passcode");

  const url = `${API_URL}?action=validateAuthority&authority=${authority}&passcode=${passcode}`;

  fetch(url)
    .then(res => res.json())
    .then(res => {
      if (res.status === "OK") {
        startScanner(authority);
      } else {
        document.getElementById("failSound").play();
        alert("Invalid passcode");
      }
    })
    .catch(err => alert("Error: " + err));
}

// 🎥 START CAMERA ONLY AFTER PASSCODE OK
function startScanner(authority) {
  html5QrCode = new Html5Qrcode("scanner");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => handleScan(decodedText, authority)
  );
}

// 📡 SCAN
function handleScan(id, authority) {
  const now = Date.now();
  if (id === lastScan && now - lastTime < 2000) return;

  lastScan = id;
  lastTime = now;

  const url = `${API_URL}?action=scan&id=${encodeURIComponent(id.trim())}&authority=${authority}`;

  fetch(url)
    .then(res => res.json())
    .then(showResult)
    .catch(err => alert("Error: " + err));
}

// 🎯 RESULT
function showResult(res) {
  const box = document.getElementById("result");

  if (res.status === "APPROVED") {
    document.getElementById("successSound").play();
  } else {
    document.getElementById("failSound").play();
  }

  box.innerHTML = `
    <div class="card ${res.status === 'APPROVED' ? 'approved' : 'denied'}">
      <h2>${res.status}</h2>
      <p>ID: ${res.id || ''}</p>
      <p>Name: ${res.name || ''}</p>
      <p>Gender: ${res.gender || ''}</p>
      <p>Age: ${res.age || ''}</p>
      <p>Facilitator: ${res.facilitator || ''}</p>
      <p>Time: ${new Date().toLocaleTimeString()}</p>
    </div>
  `;
}

</script>

</body>
</html>
